# Ultralytics YOLO26 object detection model with a timm backbone and P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins

# YOLO26 backbone: one timm trunk emits [P3, P4, P5], three Index layers split that list into separate layers
backbone:
  # [from, repeats, module, args]
  # TimmBackbone args: [declared channels, timm model, channels per level, pretrained]
  # The first number is bookkeeping only: parse_model reads it as c2 and never passes it to the module.
  - [-1, 1, TimmBackbone, [256, "resnet18", [256, 512, 1024], False]] # 0-P3/8, P4/16, P5/32
  # Index args: [declared channels, index into the trunk list]; from must be -1/-2/-3 so all three read layer 0
  - [-1, 1, Index, [256, 0]] # 1-P3/8
  - [-2, 1, Index, [512, 1]] # 2-P4/16
  - [-3, 1, Index, [1024, 2]] # 3-P5/32
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 4
  - [-1, 2, C2PSA, [1024]] # 5

# YOLO26 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 6
  - [[-1, 2], 1, Concat, [1]] # 7 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9
  - [[-1, 1], 1, Concat, [1]] # 10 cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 11 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 12
  - [[-1, 8], 1, Concat, [1]] # 13 cat head P4
  - [-1, 2, C3k2, [512, True]] # 14 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 15
  - [[-1, 5], 1, Concat, [1]] # 16 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 17 (P5/32-large)

  - [[11, 14, 17], 1, Detect, [nc]] # Detect(P3, P4, P5)
